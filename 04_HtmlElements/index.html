<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Calculator</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="p-4">

    <div class="container">

        <!-- Buttons -->
        <div class="mb-3 d-flex gap-2">
            <button onclick="demoNative()" class="btn btn-secondary">Native Types</button>
            <button id="btn2" class="btn btn-secondary">Register Click From Code</button>
        </div>

        <!-- Calculator Grid -->
        <div class="row g-3">

            <!-- Number 1 -->
            <div class="col-12 col-md-3">
                <label class="form-label">Number 1</label>
                <input id="txt1" type="text" class="form-control" placeholder="Enter number">
            </div>

            <!-- Operator -->
            <div class="col-12 col-md-2">
                <label class="form-label">Operation</label>
                <select id="operator" class="form-select">
                    <option value="+">+</option>
                    <option value="-">-</option>
                    <option value="*">*</option>
                    <option value="/">/</option>
                </select>
            </div>

            <!-- Number 2 -->
            <div class="col-12 col-md-3">
                <label class="form-label">Number 2</label>
                <input id="txt2" type="text" class="form-control" placeholder="Enter number">
            </div>

            <!-- Equal button -->
            <div class="col-12 col-md-1 d-flex align-items-end">
                <button id="btnCalc" class="btn btn-primary w-100">=</button>
            </div>

            <!-- Result -->
            <div class="col-12 col-md-3 d-flex align-items-end">
                <h3 id="lblRes"></h3>
            </div>

        </div>

        <hr class="my-4">

        <!-- LOG OUTPUT -->
        <div class="row">
            <div class="col-12">
                <label class="form-label fw-bold">Log Output</label>
                <textarea id="output" class="form-control" rows="10"></textarea>
            </div>
        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Your JS -->
    <script src="index.js"></script>

</body>

</html>
