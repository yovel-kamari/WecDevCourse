<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TubeTracker – יובל קמרי</title>

    <link rel="stylesheet" href="https://bootswatch.com/5/cyborg/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="p-4">
<div class="container">

    <h1 class="text-center text-primary mb-4">🎵 Exercise Songs List – יובל קמרי</h1>

    <!-- Toggle View Button -->
    <div class="text-end mb-3">
        <button id="toggleViewBtn" class="btn btn-secondary">
            <i id="toggleIcon" class="fas fa-th-large"></i> View
        </button>
    </div>

    <!-- Form -->
    <div class="card border-primary mb-4">
        <div class="card-body">

            <form id="songForm" class="row g-2">
                <input type="hidden" id="songId">

                <div class="col-md-4">
                    <input type="text" id="title" class="form-control" placeholder="Your Title (required)" required>
                </div>

                <div class="col-md-3">
                    <input type="number" id="rating" class="form-control" placeholder="Rating (1-10)" min="1" max="10" required>
                </div>

                <div class="col-md-5">
                    <input type="url" id="url" class="form-control" placeholder="YouTube URL" required>
                </div>

                <div class="col-md-6 mt-2">
                    <input type="text" id="youtubeTitle" class="form-control" placeholder="YouTube Title (auto)" disabled>
                </div>

                <div class="col-md-2 mt-2">
                    <button type="submit" id="submitBtn" class="btn btn-success w-100">
                        <i class="fas fa-plus"></i> Add
                    </button>
                </div>
            </form>

        </div>
    </div>

    <!-- Search + Sorting -->
    <div class="d-flex justify-content-between mb-3 align-items-center">
        <input type="text" id="search" class="form-control w-50" placeholder="Search...">
        <div class="text-white">
            <label class="me-3">
                <input type="radio" name="sortOption" value="title"> Sort by Title
            </label>
            <label class="me-3">
                <input type="radio" name="sortOption" value="date" checked> Sort by Date
            </label>
            <label>
                <input type="radio" name="sortOption" value="rating"> Sort by Rating
            </label>
        </div>
    </div>

    <!-- TABLE VIEW -->
    <table id="tableView" class="table table-hover">
        <thead>
            <tr>
                <th>Thumbnail</th>
                <th>User Title</th>
                <th>YouTube Title</th>
                <th>Rating</th>
                <th>Play</th>
                <th>Link</th>
                <th class="text-end">Actions</th>
            </tr>
        </thead>
        <tbody id="songList"></tbody>
    </table>

    <!-- CARD VIEW -->
    <div id="cardView" class="row d-none"></div>

</div>

<!-- Modal Player -->
<div class="modal fade" id="playerModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content bg-dark">
      <div class="modal-header">
        <h5 class="modal-title text-white">YouTube Player</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <iframe id="playerFrame" width="100%" height="400" 
                src="" frameborder="0" allowfullscreen></iframe>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="index.js"></script>

</body>
</html>
